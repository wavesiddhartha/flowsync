name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies & local package
        run: |
          uv pip install --system -e "packages/flowsync-core[dev]"
          uv pip install --system pyjwt redis fastapi uvicorn pytest-asyncio pytest

      - name: Run Python test suite
        run: pytest packages/flowsync-core/tests

  js-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install client dependencies
        run: |
          cd packages/flowsync-client
          npm install

      - name: Build JS client package
        run: |
          cd packages/flowsync-client
          npm run build

      - name: Run Vitest unit tests
        run: |
          cd packages/flowsync-client
          npm test -- --run
