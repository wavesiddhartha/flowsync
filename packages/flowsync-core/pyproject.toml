[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowsync"
version = "0.1.0"
description = "Core Python SDK for FlowSync - a universal real-time state synchronization library"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Siddhartha Sahani", email = "wavesiddhartha@gmail.com" }
]
dependencies = [
    "websockets>=12.0,<15.0",
    "pydantic>=2.0,<3.0",
    "aiosqlite>=0.18.0,<1.0.0",
    "pyjwt>=2.4.0,<3.0.0",
    "redis>=4.5.0,<6.0.0",
    "fastapi>=0.95.0,<1.0.0",
    "uvicorn>=0.20.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
flowsync = "flowsync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["flowsync"]
